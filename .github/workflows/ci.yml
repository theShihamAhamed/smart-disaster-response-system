name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: disaster_management_test
          POSTGRES_USER: disaster_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disaster_ci -d disaster_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://disaster_ci:ci_only_password@localhost:5432/disaster_management_test?schema=public
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests and enforce coverage
        run: npm run test:coverage

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migration to clean PostgreSQL
        run: npm run db:migrate:deploy

      - name: Seed deterministic records
        run: npm run db:seed

      - name: Verify deterministic seed
        run: npm run db:verify-seed

      - name: Build API, web and mobile export
        run: npm run build
