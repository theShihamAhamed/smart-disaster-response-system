services:
  postgres:
    image: postgres:17-alpine
    container_name: disaster-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: disaster_management
      POSTGRES_USER: disaster_app
      POSTGRES_PASSWORD: phase1_dev_only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster_app -d disaster_management"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - disaster_postgres_data:/var/lib/postgresql/data

volumes:
  disaster_postgres_data:
